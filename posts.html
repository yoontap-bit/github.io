---
layout: default
title: Posts
permalink: /posts/
description: 도시데이터 공부와 분석 아카이브의 전체 글 목록
---
<header class="post-header">
  <h1 class="post-title">Posts</h1>
  <p class="post-subtitle">도시데이터 공부와 분석 아카이브에 쌓인 글 전체</p>
</header>

<section class="archive">
  <ul class="archive-list">
    {% for post in site.posts %}
    <li>
      <a class="post-item post-item--compact" href="{{ post.url | relative_url }}">
        <time class="post-item-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time>
        <span class="post-item-title">{{ post.title }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
  {% if site.posts.size == 0 %}
  <p class="empty">아직 글이 없습니다.</p>
  {% endif %}
</section>
