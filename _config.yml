# ─────────────────────────────────────────────
#  Urban Data Log
#  GitHub Pages (Jekyll, 기본 브랜치 빌드) 설정
# ─────────────────────────────────────────────

title: "Urban Data Log"
tagline: "도시데이터 공부와 분석 아카이브"
description: "도시데이터 공부와 분석 아카이브 — 강의 노트, 과제, 지도 시각화, 회고를 쌓아두는 개인 기록."

url: "https://yoontap-bit.github.io"
baseurl: ""

lang: ko-KR
timezone: Asia/Seoul

author:
  name: "윤성현"

# 빌드 설정
markdown: kramdown
highlighter: rouge
permalink: /posts/:year/:month/:day/:title/

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

# 글 작성 시 기본 레이아웃
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
